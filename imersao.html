<html lang="pt-br" class="materias" data-contexto="imersao">
<head>

     <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="/js/script.js" defer></script>
    <title>foco e progresso</title>
</head>
<body>
    <header>
      <section class="app__header-container">
        <div class="app__tittle">
          <h1 id="appSaudacao" ></h1>
          <p id="data-hora"></p>
        </div>
        <div class="app__logo">
          <img
            class="app_logo_start"
            src="/img/app-logo-simp.png"

      </section>
    </header>
    <nav>
      <section class="app__nav_container">

            <button id="start-timer">Iniciar</button>

    <footer>
      <section class="app__footer">
        <div class="text_footer">
          <p>projeto sem fins lucrativos</p>
